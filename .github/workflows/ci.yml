name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushing twice in quick succession doesn't
# burn CI minutes running both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    # ubuntu-latest ships Docker Engine pre-installed and running, which the integration test
    # suite needs (Testcontainers.MsSql spins up a real SQL Server container per run - see
    # tests/JazeeraBooking.IntegrationTests/CustomWebApplicationFactory.cs). A windows-latest
    # runner would need a separate Docker/WSL2 setup step to get the same capability.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore JazeeraBooking.sln

      - name: Build (Release)
        run: dotnet build JazeeraBooking.sln --configuration Release --no-restore

      - name: Test (unit + integration, with coverage)
        run: >
          dotnet test JazeeraBooking.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx
            coverage/**
          retention-days: 14

  # Stubbed deploy: this repo doesn't have a paid Azure subscription behind it, so this job
  # documents the shape of the real deploy step (build a container/publish output, push to
  # Azure App Service) without executing it. Wiring it up for real would mean:
  #   1. `dotnet publish src/JazeeraBooking.Api -c Release -o ./publish`
  #   2. azure/login@v2 using an OIDC federated credential (no long-lived secret in the repo)
  #   3. azure/webapps-deploy@v3 pointing at the App Service, or push a container image to
  #      Azure Container Registry and update the App Service's image tag
  #   4. Run `dotnet ef database update` (or equivalent idempotent migration step) against the
  #      target database as part of the deploy, not on app boot - see Program.cs's comment on
  #      why auto-migration is Development-only.
  deploy-stub:
    name: Deploy (stub)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Describe what a real deploy would do here
        run: |
          echo "No Azure subscription is wired up for this portfolio project."
          echo "A real deploy step would: dotnet publish -> azure/login (OIDC) -> azure/webapps-deploy,"
          echo "followed by an explicit 'dotnet ef database update' against the target DB."
